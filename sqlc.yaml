version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries/"
    schema: "internal/db/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        emit_rows_affected: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false